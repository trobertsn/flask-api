name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: test, build, and push the image (same as before)
  build:
    runs-on: ubuntu-latest
    # Expose the image SHA tag to the next job via an output
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          pip install -r requirements.txt pytest
          pytest -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/trobertsn/flask-api:${{ github.sha }}
            ghcr.io/trobertsn/flask-api:latest

  # JOB 2: update the config repo with the new image tag (the GitOps trigger)
  update-config:
    needs: build              # only run AFTER build succeeds
    runs-on: ubuntu-latest
    steps:
      # Check out the CONFIG repo (not this one) using the PAT
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: trobertsn/flask-api-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}   # the PAT you stored

      # Replace the image line in deployment.yaml with the new SHA tag
      - name: Update image tag
        run: |
          # sed replaces whatever image tag is there with the new commit SHA
          sed -i "s|image: ghcr.io/trobertsn/flask-api:.*|image: ghcr.io/trobertsn/flask-api:${{ needs.build.outputs.image_tag }}|" staging/deployment.yaml
          echo "Updated deployment.yaml:"
          grep "image:" staging/deployment.yaml

      # Commit and push the change to the config repo — this triggers ArgoCD
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add staging/deployment.yaml
          git commit -m "Update image to ${{ needs.build.outputs.image_tag }}"
          git push
